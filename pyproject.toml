[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railyard-sync"
version = "0.1.0"
description = "Sync Railyard estates with NetBox and Nautobot: import a DCIM site as a re-importable Railyard baseline, and the shared core of the Railyard NetBox and Nautobot plugins."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Railyard" }]
keywords = ["railyard", "netbox", "nautobot", "dcim", "diffsync", "ssot"]
classifiers = [
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
# Lower bounds are security floors; upper bounds stop an untested major release arriving silently.
# - requests 2.32.4 fixes CVE-2024-35195 and CVE-2024-47081.
# - diffsync 2.x is the API the export adapter is written against (Adapter, DiffSyncFlags).
# - pydantic is imported directly by the DiffSync models, so it is declared rather than inherited.
# - PyYAML 6 removed unsafe default loaders; only yaml.safe_load is used.
dependencies = [
  "diffsync>=2.2,<3",
  "pydantic>=2,<3",
  "requests>=2.32.4,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "jsonschema>=4.21,<5",
]

[project.scripts]
railyard-sync = "railyard_sync.cli:main"

[project.urls]
Homepage = "https://github.com/railyard-sh/railyard-sync"
Source = "https://github.com/railyard-sh/railyard-sync"
Railyard = "https://railyard.sh"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
